<div class="login-page">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="login-title" data-cy="loginTitle">Connexion</h1>
      <p class="login-subtitle">Accédez à votre espace CorrespCare</p>
    </div>

    <!-- Body -->
    <div class="login-body">
      <!-- Error -->
      <div class="login-error-banner" *ngIf="authenticationError" data-cy="loginError">
        <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"
          />
        </svg>
        <span jhiTranslate="login.messages.error.authentication">Identifiants incorrects. Veuillez réessayer.</span>
      </div>

      <form role="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <!-- Username -->
        <div class="form-group">
          <label class="form-label-custom" for="username" jhiTranslate="global.form.username.label">Nom d'utilisateur</label>
          <input
            type="text"
            class="form-input"
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            #username
            data-cy="username"
            (input)="loginForm.get('username')?.setValue(username.value)"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label-custom" for="password" jhiTranslate="login.form.password">Mot de passe</label>
          <input
            type="password"
            class="form-input"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            #passwordField
            data-cy="password"
          />
        </div>

        <!-- Remember me + Forgot password -->
        <div class="remember-row">
          <label class="remember-check" for="rememberMe">
            <input type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span jhiTranslate="login.form.rememberme">Se souvenir de moi</span>
          </label>
          <a
            class="forgot-link"
            routerLink="/account/reset/request"
            data-cy="forgetYourPasswordSelector"
            jhiTranslate="login.password.forgot"
            >Mot de passe oublié ?</a
          >
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn" data-cy="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span jhiTranslate="login.form.button">Se connecter</span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <div class="login-divider">
        <span>ou</span>
      </div>
      <p class="register-link">
        <span jhiTranslate="global.messages.info.register.noaccount">Pas encore de compte ?</span>&nbsp;
        <a routerLink="/account/register" jhiTranslate="global.messages.info.register.link">Créer un compte</a>
      </p>
    </div>
  </div>
</div>
