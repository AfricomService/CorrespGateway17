<div *ngIf="account">
  <!--<div style="display: flex;flex-direction: column;justify-content: space-between;align-items: center;width: 100%">-->

  <div class="row" style="display: flex; flex-direction: column; justify-content: space-between; gap: 2em; align-items: center">
    <div style="width: 100%; padding-bottom: 2em">
      <h3 style="padding-left: 0px; font-weight: bold; font-style: italic; text-transform: uppercase; padding-bottom: 1em; color: #c1121f">
        Bienvenue, {{ account.firstName }} !
      </h3>
      <h4 style="font-weight: bold; font-style: italic; text-transform: uppercase; padding-bottom: 1em">ajouter un Courrier</h4>
      <div
        style="display: flex; flex-direction: row; justify-content: space-between; padding-left: 0px; padding-right: 0px"
        class="col-md-12"
      >
        <div class="col-md-2 button_slide slide_right" (click)="onTypeClicked('Arrivée')">Arrivée</div>
        <div class="col-md-2 button_slide slide_right" (click)="onTypeClicked('Sortant')">Sortant</div>
        <div class="col-md-2 button_slide slide_right" (click)="onTypeClicked('Interne')">Interne</div>
      </div>
    </div>

    <div style="padding-left: 0px; padding-right: 0px; display: flex; flex-direction: row; justify-content: space-between; width: 100%">
      <div style="width: 45%">
        <h4 style="font-weight: bold; font-style: italic; text-transform: uppercase">Taches En Cours</h4>
        <div style="padding-left: 0px; padding-right: 0px">
          <dx-data-grid
            [dataSource]="tasks!"
            (onDataErrorOccurred)="refresh()"
            [errorRowEnabled]="false"
            [showBorders]="true"
            [height]="'100%'"
            (onRowDblClick)="onRowDblClick($event)"
            [selection]="selection"
            [loadPanel]="loadPanel"
            [export]="export"
            [sorting]="sorting"
            [columnAutoWidth]="true"
            [searchPanel]="searchPanel"
          >
            <dxi-column dataField="object" caption="Object" dataType="string" alignment="alignment"></dxi-column>

            <dxi-column
              dataField="creationDate"
              caption="Date De Creation"
              dataType="date"
              format="yyyy-MM-dd HH:mm"
              alignment="alignment"
            ></dxi-column>

            <dxi-column
              dataField="startDate"
              caption="Date De Début"
              dataType="date"
              format="yyyy-MM-dd HH:mm"
              alignment="alignment"
            ></dxi-column>

            <dxi-column
              dataField="duedate"
              caption="Date Limite"
              dataType="date"
              format="yyyy-MM-dd HH:mm"
              alignment="alignment"
            ></dxi-column>

            <dxi-column
              dataField="closeDate"
              caption="Date De Cloture"
              dataType="date"
              format="yyyy-MM-dd HH:mm"
              alignment="alignment"
            ></dxi-column>

            <dxi-column dataField="responsible" caption="Résponsable" dataType="string" alignment="alignment"></dxi-column>
          </dx-data-grid>
        </div>
      </div>
      <div style="width: 45%">
        <h4 style="font-weight: bold; font-style: italic; text-transform: uppercase">Dossiers</h4>
        <div style="padding-left: 0px; padding-right: 0px">
          <dx-data-grid
            [dataSource]="dossiers!"
            (onDataErrorOccurred)="refresh()"
            [errorRowEnabled]="false"
            [showBorders]="true"
            [height]="'100%'"
            (onRowDblClick)="onRowDblClickDossier($event)"
            [selection]="selection"
            [loadPanel]="loadPanel"
            [searchPanel]="searchPanel"
            [export]="export"
            [sorting]="sorting"
            [columnAutoWidth]="true"
            (onRowPrepared)="onRowPrepared($event)"
          >
            <dxi-column dataField="name" caption="Nom" dataType="string" alignment="alignment"></dxi-column>

            <dxi-column dataField="isPublic" caption="Publique" dataType="boolean" alignment="alignment"></dxi-column>

            <dxi-column dataField="responsible" caption="Responsable" dataType="string" alignment="alignment"></dxi-column>

            <dxi-column dataField="status" caption="Etat" dataType="string" alignment="alignment"></dxi-column>
          </dx-data-grid>
        </div>
      </div>
    </div>
  </div>
</div>
