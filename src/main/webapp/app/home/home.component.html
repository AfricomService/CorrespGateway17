<!-- src/main/webapp/app/home/home.component.html -->
<div *ngIf="account" class="corresp-dashboard">
  <!-- HERO / HEADER -->
  <header class="hero">
    <div class="container hero-inner">
      <div class="welcome">
        <div class="welcome-emoji" aria-hidden="true">👋</div>
        <div class="welcome-text">
          <h1 class="welcome-title" jhiTranslate="home.title" [translateValues]="{ firstName: account.firstName }">
            Bienvenue, {{ account.firstName }}
          </h1>
          <p class="welcome-sub" jhiTranslate="home.subtitle">Gérez vos courriers et tâches en toute simplicité</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-area">
    <div class="container">
      <!-- NOUVEAU COURRIER CARD -->
      <section class="card mail-card" aria-labelledby="nouveau-courrier-title">
        <div class="card-header">
          <h2 id="nouveau-courrier-title" jhiTranslate="home.newMail">✨ Nouveau Courrier</h2>
        </div>

        <div class="mail-options" role="list">
          <!-- ARRIVEE -->
          <div
            class="mail-option"
            role="button"
            tabindex="0"
            [attr.aria-label]="'home.arrival' | translate"
            (click)="onTypeClicked('Arrivée')"
            (keydown.enter)="onTypeClicked('Arrivée')"
            (keydown.space)="onTypeClicked('Arrivée')"
          >
            <span class="option-icon" aria-hidden="true" style="font-size: 84px; display: inline-block; line-height: 1; text-align: center"
              >📥</span
            >
            <div class="option-title" jhiTranslate="home.arrival">ARRIVÉE</div>
            <div class="option-sub" jhiTranslate="home.arrivalSub">Enregistrer un courrier entrant</div>
          </div>

          <!-- SORTANT -->
          <div
            class="mail-option"
            role="button"
            tabindex="0"
            [attr.aria-label]="'home.outgoing' | translate"
            (click)="onTypeClicked('Sortant')"
            (keydown.enter)="onTypeClicked('Sortant')"
            (keydown.space)="onTypeClicked('Sortant')"
          >
            <span class="option-icon" aria-hidden="true" style="font-size: 84px; display: inline-block; line-height: 1; text-align: center"
              >📤</span
            >
            <div class="option-title" jhiTranslate="home.outgoing">SORTANT</div>
            <div class="option-sub" jhiTranslate="home.outgoingSub">Créer un courrier sortant</div>
          </div>

          <!-- INTERNE -->
          <div
            class="mail-option"
            role="button"
            tabindex="0"
            [attr.aria-label]="'home.internal' | translate"
            (click)="onTypeClicked('Interne')"
            (keydown.enter)="onTypeClicked('Interne')"
            (keydown.space)="onTypeClicked('Interne')"
          >
            <span class="option-icon" aria-hidden="true" style="font-size: 84px; display: inline-block; line-height: 1; text-align: center"
              >📋</span
            >
            <div class="option-title" jhiTranslate="home.internal">INTERNE</div>
            <div class="option-sub" jhiTranslate="home.internalSub">Communication interne</div>
          </div>
        </div>
      </section>

      <!-- TWO COLUMNS: TACHES + DOSSIERS -->
      <section class="two-columns" aria-labelledby="panels-title">
        <h3 id="panels-title" class="sr-only" jhiTranslate="home.panelsTitle">Tâches et dossiers</h3>

        <!-- PANEL: TÂCHES -->
        <div class="panel tasks-panel" role="region" aria-labelledby="taches-title">
          <div class="panel-header tasks-header">
            <div class="header-top">
              <div class="tasks-left">
                <h4 id="taches-title" class="panel-title" jhiTranslate="home.tasksTitle">Tâches en cours</h4>
                <div class="task-count" aria-hidden="true">{{ tasksCount }}</div>
              </div>

              <div class="header-actions">
                <!-- Export buttons group -->
                <div class="export-group" role="group" aria-label="Exports">
                  <button
                    class="export-btn"
                    type="button"
                    [attr.aria-label]="'home.exportExcel' | translate"
                    (click)="exportTasksToExcel()"
                  >
                    <svg class="export-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="1.2"></path>
                      <path d="M7 7v10M17 7v10" stroke="currentColor" stroke-width="1.6"></path>
                      <path d="M7 11h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                    </svg>
                    <span class="export-label" jhiTranslate="home.exportExcel">Excel</span>
                  </button>

                  <button
                    class="export-btn ghost"
                    type="button"
                    [attr.aria-label]="'home.exportCsv' | translate"
                    (click)="exportTasksToCsv()"
                  >
                    <svg class="export-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="1.2"></path>
                      <path d="M6 8h12M6 12h12M6 16h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                    </svg>
                    <span class="export-label" jhiTranslate="home.exportCsv">CSV</span>
                  </button>
                </div>

                <!-- Barre de recherche -->
                <div class="header-search">
                  <label class="sr-only" for="tasksSearch" jhiTranslate="home.searchTasksLabel">Rechercher tâches</label>
                  <div class="search-container header-search--large">
                    <input
                      id="tasksSearch"
                      #tasksSearch
                      class="search-input"
                      [placeholder]="'home.searchTasks' | translate"
                      (input)="onTasksSearchInput($any($event.target).value)"
                    />
                    <button
                      class="search-btn"
                      type="button"
                      [attr.aria-label]="'home.search' | translate"
                      (click)="onTasksSearchClick(tasksSearch.value)"
                    >
                      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path
                          d="M21 21l-4.35-4.35"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"
                        ></path>
                        <circle cx="11" cy="11" r="5" stroke="currentColor" stroke-width="1.8" fill="none"></circle>
                      </svg>
                    </button>

                    <button
                      class="search-clear-btn"
                      type="button"
                      [attr.aria-label]="'home.clearSearch' | translate"
                      (click)="clearTasksSearch(tasksSearch)"
                    >
                      ✖
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Data grid -->
          <div class="panel-body">
            <dx-data-grid
              #tasksGrid
              [dataSource]="tasks!"
              (onDataErrorOccurred)="refresh()"
              [errorRowEnabled]="false"
              [showBorders]="true"
              [height]="'100%'"
              (onRowDblClick)="onRowDblClick($event)"
              (onRowPrepared)="onRowPrepared($event)"
              [selection]="selection"
              [loadPanel]="loadPanel"
              [sorting]="sorting"
              [columnAutoWidth]="true"
            >
              <dxi-column dataField="object" [caption]="'home.objet' | translate" dataType="string"></dxi-column>
              <dxi-column
                dataField="creationDate"
                [caption]="'home.creation' | translate"
                dataType="date"
                format="yyyy-MM-dd HH:mm"
              ></dxi-column>
              <dxi-column dataField="startDate" [caption]="'home.debut' | translate" dataType="date" format="yyyy-MM-dd HH:mm"></dxi-column>
              <dxi-column dataField="duedate" [caption]="'home.limite' | translate" dataType="date" format="yyyy-MM-dd HH:mm"></dxi-column>
              <dxi-column
                dataField="closeDate"
                [caption]="'home.cloture' | translate"
                dataType="date"
                format="yyyy-MM-dd HH:mm"
              ></dxi-column>
              <dxi-column dataField="responsible" [caption]="'home.responsable' | translate" dataType="string"></dxi-column>
              <dxi-column dataField="etat" [caption]="'home.etat' | translate" dataType="string"></dxi-column>
            </dx-data-grid>
          </div>
        </div>

        <!-- PANEL: DOSSIERS -->
        <div class="panel dossiers-panel" role="region" aria-labelledby="dossiers-title">
          <div class="panel-header dossiers-header">
            <div class="header-top">
              <div>
                <h4 id="dossiers-title" class="panel-title" jhiTranslate="home.dossiersTitle">Dossiers</h4>
              </div>

              <div class="header-actions">
                <div class="export-group" role="group" aria-label="Exports Dossiers">
                  <button
                    class="export-btn"
                    type="button"
                    [attr.aria-label]="'home.exportExcel' | translate"
                    (click)="exportDossiersToExcel()"
                  >
                    <svg class="export-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="1.2"></path>
                      <path d="M7 7v10M17 7v10" stroke="currentColor" stroke-width="1.6"></path>
                      <path d="M7 11h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                    </svg>
                    <span class="export-label" jhiTranslate="home.exportExcel">Excel</span>
                  </button>
                </div>

                <!-- NOTE: same size as tasks search -->
                <div class="header-search">
                  <label class="sr-only" for="dossiersSearch" jhiTranslate="home.searchDossiersLabel">Rechercher dossiers</label>
                  <div class="search-container header-search--large">
                    <input
                      id="dossiersSearch"
                      #dossiersSearch
                      class="search-input"
                      [placeholder]="'home.searchDossiers' | translate"
                      (input)="onDossiersSearchInput($any($event.target).value)"
                    />
                    <button
                      class="search-btn"
                      type="button"
                      [attr.aria-label]="'home.search' | translate"
                      (click)="onDossiersSearchClick(dossiersSearch.value)"
                    >
                      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path
                          d="M21 21l-4.35-4.35"
                          stroke="currentColor"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"
                        ></path>
                        <circle cx="11" cy="11" r="5" stroke="currentColor" stroke-width="1.8" fill="none"></circle>
                      </svg>
                    </button>
                    <button
                      class="search-clear-btn"
                      type="button"
                      [attr.aria-label]="'home.clearSearch' | translate"
                      (click)="clearDossiersSearch(dossiersSearch)"
                    >
                      ✖
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel-body">
            <dx-data-grid
              #dossiersGrid
              [dataSource]="dossiers!"
              (onDataErrorOccurred)="refresh()"
              [errorRowEnabled]="false"
              [showBorders]="true"
              [height]="'100%'"
              (onRowDblClick)="onRowDblClickDossier($event)"
              (onRowPrepared)="onRowPrepared($event)"
              [selection]="selection"
              [loadPanel]="loadPanel"
              [sorting]="sorting"
              [columnAutoWidth]="true"
            >
              <dxi-column dataField="name" [caption]="'home.nom' | translate" dataType="string"></dxi-column>
              <dxi-column dataField="isPublic" [caption]="'home.publique' | translate" dataType="boolean"></dxi-column>
              <dxi-column dataField="responsible" [caption]="'home.responsable' | translate" dataType="string"></dxi-column>
              <dxi-column dataField="status" [caption]="'home.etat' | translate" dataType="string"></dxi-column>
            </dx-data-grid>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
