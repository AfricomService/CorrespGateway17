<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-notif-heading"
        data-cy="NotifCreateUpdateHeading"
        jhiTranslate="correspCareApp.connectionManageNotif.home.createOrEditLabel"
      >
        Créer ou éditer un Notif
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.id" for="field_id">Id</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          <div *ngIf="editForm.get('id')!.invalid && (editForm.get('id')!.dirty || editForm.get('id')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('id')?.errors?.required" jhiTranslate="entity.validation.required">
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.title" for="field_title">Title</label>
          <input type="text" class="form-control" name="title" id="field_title" data-cy="title" formControlName="title" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.body" for="field_body">Body</label>
          <textarea class="form-control" name="body" id="field_body" data-cy="body" formControlName="body"></textarea>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.recipientEmail" for="field_recipientEmail"
            >Recipient Email</label
          >
          <input
            type="text"
            class="form-control"
            name="recipientEmail"
            id="field_recipientEmail"
            data-cy="recipientEmail"
            formControlName="recipientEmail"
          />
          <div
            *ngIf="
              editForm.get('recipientEmail')!.invalid && (editForm.get('recipientEmail')!.dirty || editForm.get('recipientEmail')!.touched)
            "
          >
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('recipientEmail')?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.recipeientccemail" for="field_recipeientccemail"
            >Recipeientccemail</label
          >
          <input
            type="text"
            class="form-control"
            name="recipeientccemail"
            id="field_recipeientccemail"
            data-cy="recipeientccemail"
            formControlName="recipeientccemail"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.receipientbccemail" for="field_receipientbccemail"
            >Receipientbccemail</label
          >
          <input
            type="text"
            class="form-control"
            name="receipientbccemail"
            id="field_receipientbccemail"
            data-cy="receipientbccemail"
            formControlName="receipientbccemail"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.senderEmail" for="field_senderEmail"
            >Sender Email</label
          >
          <input
            type="text"
            class="form-control"
            name="senderEmail"
            id="field_senderEmail"
            data-cy="senderEmail"
            formControlName="senderEmail"
          />
          <div *ngIf="editForm.get('senderEmail')!.invalid && (editForm.get('senderEmail')!.dirty || editForm.get('senderEmail')!.touched)">
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('senderEmail')?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.sentDate" for="field_sentDate">Sent Date</label>
          <div class="d-flex">
            <input
              id="field_sentDate"
              data-cy="sentDate"
              type="datetime-local"
              class="form-control"
              name="sentDate"
              formControlName="sentDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.status" for="field_status">Status</label>
          <select class="form-control" name="status" formControlName="status" id="field_status" data-cy="status">
            <option [ngValue]="null">{{ 'correspCareApp.NotificationStatus.null' | translate }}</option>
            <option *ngFor="let notificationStatus of notificationStatusValues" [value]="notificationStatus">
              {{ 'correspCareApp.NotificationStatus.' + notificationStatus | translate }}
            </option>
          </select>
          <div *ngIf="editForm.get('status')!.invalid && (editForm.get('status')!.dirty || editForm.get('status')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('status')?.errors?.required" jhiTranslate="entity.validation.required">
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.typeNotif" for="field_typeNotif">Type Notif</label>
          <input type="text" class="form-control" name="typeNotif" id="field_typeNotif" data-cy="typeNotif" formControlName="typeNotif" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.connectionManageNotif.messageID" for="field_messageID">Message ID</label>
          <input type="number" class="form-control" name="messageID" id="field_messageID" data-cy="messageID" formControlName="messageID" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
