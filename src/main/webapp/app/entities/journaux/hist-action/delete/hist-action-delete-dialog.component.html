<form *ngIf="histAction" name="deleteForm" (ngSubmit)="confirmDelete(histAction.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="histActionDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>

    <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
  </div>

  <div class="modal-body">
    <jhi-alert-error></jhi-alert-error>
    <p
      id="jhi-delete-histAction-heading"
      jhiTranslate="correspCareApp.journauxHistAction.delete.question"
      [translateValues]="{ id: histAction.id }"
    >
      Êtes-vous certain de vouloir supprimer le Hist Action {{ histAction.id }} ?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
      <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
    </button>

    <button id="jhi-confirm-delete-histAction" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
    </button>
  </div>
</form>
