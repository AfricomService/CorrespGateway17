<div>
  <h2 id="page-heading" data-cy="HistActionHeading">
    <span jhiTranslate="correspCareApp.journauxHistAction.home.title">HistActions</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="correspCareApp.journauxHistAction.home.refreshListLabel">Actualiser la liste</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-hist-action"
        [routerLink]="['/hist-action/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="correspCareApp.journauxHistAction.home.createLabel"> Créer un nouveau Hist Action </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <div class="alert alert-warning" id="no-result" *ngIf="histActions?.length === 0">
    <span jhiTranslate="correspCareApp.journauxHistAction.home.notFound">Aucun Hist Action trouvé</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="histActions && histActions.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.id">Id</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="dateTransaction">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.dateTransaction">Date Transaction</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="loginUser">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.loginUser">Login User</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="transaction">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.transaction">Transaction</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="actionRef">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.actionRef">Action Ref</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="actionJson">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.journauxHistAction.actionJson">Action Json</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let histAction of histActions; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/hist-action', histAction.id, 'view']">{{ histAction.id }}</a>
          </td>
          <td>{{ histAction.dateTransaction | formatMediumDatetime }}</td>
          <td>{{ histAction.loginUser }}</td>
          <td>{{ histAction.transaction }}</td>
          <td>{{ histAction.actionRef }}</td>
          <td>{{ histAction.actionJson }}</td>
          <td class="text-end">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/hist-action', histAction.id, 'view']"
                class="btn btn-info btn-sm"
                data-cy="entityDetailsButton"
              >
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">Voir</span>
              </button>

              <button
                type="submit"
                [routerLink]="['/hist-action', histAction.id, 'edit']"
                class="btn btn-primary btn-sm"
                data-cy="entityEditButton"
              >
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Editer</span>
              </button>

              <button type="submit" (click)="delete(histAction)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Supprimer</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="histActions && histActions.length > 0">
    <div class="d-flex justify-content-center">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
    </div>

    <div class="d-flex justify-content-center">
      <ngb-pagination
        [collectionSize]="totalItems"
        [page]="page"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="navigateToPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>
