<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="employe">
      <h2 data-cy="employeDetailsHeading"><span jhiTranslate="correspCareApp.employe.detail.title">Employe</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="correspCareApp.employe.id">Id</span></dt>
        <dd>
          <span>{{ employe.id }}</span>
        </dd>
        <dt><span jhiTranslate="correspCareApp.employe.jobTitle">Job Title</span></dt>
        <dd>
          <span>{{ employe.jobTitle }}</span>
        </dd>
        <dt><span jhiTranslate="correspCareApp.employe.email">Email</span></dt>
        <dd>
          <span>{{ employe.email }}</span>
        </dd>
        <dt><span jhiTranslate="correspCareApp.employe.phoneNumber">Phone Number</span></dt>
        <dd>
          <span>{{ employe.phoneNumber }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/employe', employe.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
  </div>
</div>
