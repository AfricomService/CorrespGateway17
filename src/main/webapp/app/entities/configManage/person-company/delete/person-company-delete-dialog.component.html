<form *ngIf="personCompany" name="deleteForm" (ngSubmit)="confirmDelete(personCompany.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="personCompanyDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>

    <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
  </div>

  <div class="modal-body">
    <jhi-alert-error></jhi-alert-error>

    <!--
      On fournit id et name pour être compatible avec les anciennes clés ({{ id }})
      et avec la clé plus claire ({{ name }}). Le texte intérieur sert de fallback si la clé i18n manque.
    -->
    <p
      id="jhi-delete-personCompany-heading"
      jhiTranslate="correspCareApp.configManagePersonCompany.delete.question"
      [translateValues]="{ id: personCompany.nom, name: personCompany.nom }"
    >
      Êtes-vous certain de vouloir supprimer le contact « {{ personCompany.nom || '—' }} » ?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
      <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
    </button>

    <button id="jhi-confirm-delete-personCompany" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
    </button>
  </div>
</form>
