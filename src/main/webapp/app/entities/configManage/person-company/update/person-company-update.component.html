<div class="person-company-page d-flex justify-content-center py-4">
  <div class="person-company-card card shadow-sm w-100" style="max-width: 900px">
    <!-- En-tête : design calqué sur contact-list (bg-primary, texte blanc, padding) -->
    <div
      class="card-header bg-primary text-white d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2"
    >
      <div class="page-title">
        <h1 class="mb-0">Créer / Éditer un contact</h1>
        <small class="text-white-75">Informations du contact et liaison avec la société</small>
      </div>
    </div>

    <div class="card-body">
      <form id="personForm" name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
        <jhi-alert-error></jhi-alert-error>

        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <div class="row gx-3 gy-3">
          <!-- Left column -->
          <div class="col-12 col-md-6">
            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.nom" for="field_nom">Nom *</label>
              <input
                type="text"
                class="form-control form-control-lg"
                name="nom"
                id="field_nom"
                data-cy="nom"
                formControlName="nom"
                placeholder="Nom du contact"
                aria-required="true"
                autofocus
              />
              <div
                class="invalid-feedback d-block"
                *ngIf="editForm.get('nom')!.invalid && (editForm.get('nom')!.dirty || editForm.get('nom')!.touched)"
              >
                <small *ngIf="editForm.get('nom')?.errors?.required" jhiTranslate="entity.validation.required"
                  >Ce champ est obligatoire.</small
                >
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.pays" for="field_pays">Pays</label>
              <input
                type="text"
                class="form-control"
                name="pays"
                id="field_pays"
                data-cy="pays"
                formControlName="pays"
                placeholder="Ex: Tunisie"
              />
            </div>

            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.adresse" for="field_adresse">Adresse</label>
              <input
                type="text"
                class="form-control"
                name="adresse"
                id="field_adresse"
                data-cy="adresse"
                formControlName="adresse"
                placeholder="Adresse postale"
              />
            </div>
          </div>

          <!-- Right column -->
          <div class="col-12 col-md-6">
            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.tel" for="field_tel">Tel</label>
              <input type="text" class="form-control" name="tel" id="field_tel" data-cy="tel" formControlName="tel" placeholder="tel" />
            </div>

            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.fax" for="field_fax">Fax</label>
              <input type="text" class="form-control" name="fax" id="field_fax" data-cy="fax" formControlName="fax" placeholder="Fax" />
            </div>

            <div class="form-group">
              <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.email" for="field_email">Email</label>
              <input
                type="email"
                class="form-control"
                name="email"
                id="field_email"
                data-cy="email"
                formControlName="email"
                placeholder="email@exemple.com"
              />
            </div>
          </div>

          <!-- Full width controls -->
          <div class="col-12">
            <div class="row gx-3">
              <div class="col-12 col-md-6">
                <div class="form-group">
                  <label class="form-label" jhiTranslate="correspCareApp.configManagePersonCompany.whatsapp" for="field_whatsapp"
                    >Whatsapp</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="whatsapp"
                    id="field_whatsapp"
                    data-cy="whatsapp"
                    formControlName="whatsapp"
                    placeholder="whatsapp"
                  />
                </div>
              </div>

              <!-- NOTE: Le bloc 'Etat' a été retiré -->
            </div>
          </div>

          <!-- contactCompanyId (inchangable) : on garde l'id caché dans le form, on affiche le NOM -->
          <div class="col-12">
            <div class="form-group readonly-field d-flex align-items-center justify-content-between">
              <div>
                <label class="form-label mb-1" for="field_contactCompanyId">Société</label>

                <!-- hidden input pour garder contactCompanyId dans le form -->
                <input type="hidden" id="field_contactCompanyId" formControlName="contactCompanyId" />

                <div class="d-flex align-items-center gap-2">
                  <!-- affichage du NOM (readonly) -->
                  <input
                    type="text"
                    class="form-control form-control-plaintext readonly-input"
                    id="field_contactCompanyName"
                    data-cy="contactCompanyName"
                    [value]="contactCompanyName || ''"
                    readonly
                    aria-readonly="true"
                  />
                  <span class="badge company-badge" *ngIf="contactCompanyName">
                    <fa-icon icon="building" class="me-1"></fa-icon>
                    {{ contactCompanyName }}
                    <small class="ms-2 text-muted">Liaison</small>
                  </span>
                </div>
                <small class="form-text text-muted">Le lien vers la société est verrouillé et ne peut pas être modifié ici.</small>
              </div>

              <div class="d-none d-md-block text-end">
                <a
                  *ngIf="editForm.get('contactCompanyId')?.value"
                  class="btn btn-sm btn-outline-primary btn-animated"
                  [routerLink]="['/contact-company', editForm.get('contactCompanyId')?.value, 'view']"
                  title="Voir la société liée"
                >
                  <fa-icon icon="eye"></fa-icon>&nbsp;Voir la société
                </a>
              </div>
            </div>
          </div>

          <!-- NOTE: Le champ 'Id' n'est plus affiché dans l'UI -->
        </div>

        <!-- Barre d'actions (bas) : Annuler + Sauvegarder côte à côte -->
        <div class="actions-row mt-4 d-flex justify-content-end gap-2">
          <button type="button" id="cancel-save" class="btn btn-outline-secondary btn-animated" (click)="previousState()">
            <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
          </button>

          <button
            type="submit"
            id="save-entity"
            data-cy="entityCreateSaveButton"
            [disabled]="editForm.invalid || isSaving"
            class="btn btn-primary btn-animated"
          >
            <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
