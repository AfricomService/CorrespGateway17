<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-numsequentielle-heading"
        data-cy="NumsequentielleCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageNumsequentielle.home.createOrEditLabel"
      >
        Créer ou éditer un Numsequentielle
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.configManageNumsequentielle.id" for="field_id">Id</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          <div *ngIf="editForm.get('id')!.invalid && (editForm.get('id')!.dirty || editForm.get('id')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('id')?.errors?.required" jhiTranslate="entity.validation.required">
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageNumsequentielle.prefix" for="field_prefix">Prefix</label>
          <input type="text" class="form-control" name="prefix" id="field_prefix" data-cy="prefix" formControlName="prefix" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageNumsequentielle.nextNumber" for="field_nextNumber"
            >Next Number</label
          >
          <input
            type="number"
            class="form-control"
            name="nextNumber"
            id="field_nextNumber"
            data-cy="nextNumber"
            formControlName="nextNumber"
          />
          <div *ngIf="editForm.get('nextNumber')!.invalid && (editForm.get('nextNumber')!.dirty || editForm.get('nextNumber')!.touched)">
            <small
              class="form-text text-danger"
              *ngIf="editForm.get('nextNumber')?.errors?.required"
              jhiTranslate="entity.validation.required"
            >
              Ce champ est obligatoire.
            </small>
            <small
              class="form-text text-danger"
              [hidden]="!editForm.get('nextNumber')?.errors?.number"
              jhiTranslate="entity.validation.number"
            >
              Ce champ doit être un nombre.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" for="field_codeNumSeq">
            Code Num Séq <span class="text-danger">*</span>
            <small class="text-muted ms-2">(ex: AR-AF, SR-GDC, IN-AF)</small>
          </label>
          <input
            type="text"
            class="form-control"
            name="codeNumSeq"
            id="field_codeNumSeq"
            data-cy="codeNumSeq"
            formControlName="codeNumSeq"
            placeholder="Ex : AR-AF"
          />
          <div style="margin-top: 6px; font-size: 12px; color: #6c757d">
            Convention : <strong>AR</strong>=Arrivée, <strong>SR</strong>=Sortant, <strong>IN</strong>=Interne +
            <strong>-AF</strong>=Africom, <strong>-GDC</strong>=GDC
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageNumsequentielle.format" for="field_format">Format</label>
          <input type="text" class="form-control" name="format" id="field_format" data-cy="format" formControlName="format" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
