<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-typedocument-heading"
        data-cy="TypedocumentCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageTypedocument.home.createOrEditLabel"
      >
        Créer ou éditer un Typedocument
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.id" for="field_id">Id</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.nom" for="field_nom">Nom</label>
          <input type="text" class="form-control" name="nom" id="field_nom" data-cy="nom" formControlName="nom" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.defautdest" for="field_defautdest"
            >Defautdest</label
          >
          <input
            type="text"
            class="form-control"
            name="defautdest"
            id="field_defautdest"
            data-cy="defautdest"
            formControlName="defautdest"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.defaultobject" for="field_defaultobject"
            >Defaultobject</label
          >
          <input
            type="text"
            class="form-control"
            name="defaultobject"
            id="field_defaultobject"
            data-cy="defaultobject"
            formControlName="defaultobject"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.defaultencopie" for="field_defaultencopie"
            >Defaultencopie</label
          >
          <input
            type="text"
            class="form-control"
            name="defaultencopie"
            id="field_defaultencopie"
            data-cy="defaultencopie"
            formControlName="defaultencopie"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.usualstatus" for="field_usualstatus"
            >Usualstatus</label
          >
          <select class="form-control" name="usualstatus" formControlName="usualstatus" id="field_usualstatus" data-cy="usualstatus">
            <option [ngValue]="null">{{ 'correspCareApp.UsualStatus.null' | translate }}</option>
            <option *ngFor="let usualStatus of usualStatusValues" [value]="usualStatus">
              {{ 'correspCareApp.UsualStatus.' + usualStatus | translate }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
