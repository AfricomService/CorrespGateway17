<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-typedocument-heading"
        data-cy="TypedocumentCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageTypedocument.home.createOrEditLabel"
      >
        Créer ou éditer un Typedocument
      </h2>
      <div class="p-3">
        <jhi-alert-error></jhi-alert-error>

        <!-- ID -->
        <!--        <div class="mb-3" *ngIf="editForm.controls.id.value !== null">-->
        <!--          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.id">Id</label>-->
        <!--          <input-->
        <!--            type="number"-->
        <!--            class="form-control"-->
        <!--            formControlName="id"-->
        <!--            [readonly]="true"-->
        <!--          />-->
        <!--        </div>-->

        <!-- NOM -->
        <div class="mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.nom">Nom</label>
          <input type="text" class="form-control" formControlName="nom" />
        </div>

        <!-- DEFAULTOBJECT -->
        <div class="mb-3">
          <label class="form-label"> Objet Par Défaut </label>
          <input type="text" class="form-control" formControlName="defaultobject" />
        </div>

        <!-- LABEL DEFAUTDEST -->
        <div class="mb-3">
          <label class="form-label"> Destinataire Par Défaut </label>

          <div class="d-flex" style="gap: 0.5em">
            <input type="text" class="form-control" formControlName="labelDD" readonly />

            <input type="text" class="form-control" formControlName="defautdest" readonly />

            <button type="button" class="btn btn-secondary ms-2" (click)="openAddTaskModal(AddTaskModal)">
              {{ isEditMode ? 'Modifier' : 'Ajouter' }}
            </button>
          </div>
        </div>

        <!-- LABEL DEFAULTENCOPIE -->
        <div class="mb-3">
          <label class="form-label"> Destinataire En Copie Par Défaut </label>

          <div class="d-flex" style="gap: 0.5em">
            <input type="text" class="form-control" formControlName="labelDCC" readonly />

            <input type="text" class="form-control" formControlName="defaultencopie" readonly />

            <button type="button" class="btn btn-secondary ms-2" (click)="openAddTaskModal1(AddTaskModal1)">
              {{ isEditMode ? 'Modifier' : 'Ajouter' }}
            </button>
          </div>
        </div>

        <!-- USUALSTATUS -->
        <div class="mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageTypedocument.usualstatus"> Usualstatus </label>

          <select class="form-control" formControlName="usualstatus">
            <option [ngValue]="null">
              {{ 'correspCareApp.UsualStatus.null' | translate }}
            </option>
            <option *ngFor="let usualStatus of usualStatusValues" [value]="usualStatus">
              {{ 'correspCareApp.UsualStatus.' + usualStatus | translate }}
            </option>
          </select>
        </div>

        <!-- CORRESPTYPE -->
        <div class="mb-3">
          <label class="form-label">Type de Correspondance</label>
          <select class="form-control" formControlName="correspType">
            <option [ngValue]="null">-- Sélectionner un type --</option>
            <option value="Entrant">Entrant</option>
            <option value="Sortant">Sortant</option>
            <option value="Interne">Interne</option>
          </select>
        </div>
      </div>

      <ng-template #AddTaskModal let-AddTaskModal class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-header">
          <h5 class="modal-title">Modifier un département</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="AddTaskModal.close('Close click')"></button>
        </div>

        <div style="height: 100%" class="modal-body">
          <!-- Tree logic removed -->
        </div>

        <div class="modal-footer d-flex justify-content-between">
          <div>
            <button type="button" class="btn btn-light" (click)="AddTaskModal.close('Close click')">Annuler</button>
            <button type="button" class="btn btn-primary" (click)="dismissAll()">Enregistrer</button>
          </div>
        </div>
      </ng-template>

      <ng-template #AddTaskModal1 let-AddTaskModal1 class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-header">
          <h5 class="modal-title">Sélectionner un département</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="AddTaskModal1.close('Close click')"></button>
        </div>

        <div style="height: 100%" class="modal-body">
          <!-- Tree logic removed -->
        </div>

        <div class="modal-footer d-flex justify-content-between">
          <div>
            <button type="button" class="btn btn-light" (click)="AddTaskModal1.close('Close click')">Annuler</button>
            <button type="button" class="btn btn-primary" (click)="dismissAll()">Enregistrer</button>
          </div>
        </div>
      </ng-template>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;
          <span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;
          <span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
