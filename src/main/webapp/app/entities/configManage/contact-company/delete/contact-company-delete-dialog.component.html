<form *ngIf="contactCompany" name="deleteForm" (ngSubmit)="confirmDelete(contactCompany.id!)">
  <div class="modal-header">
    <h5 class="modal-title" data-cy="contactCompanyDeleteDialogHeading">
      {{ 'correspCareApp.configManageContactCompany.modal.title' | translate }}
    </h5>

    <button
      type="button"
      class="btn-close"
      [attr.aria-label]="'correspCareApp.configManageContactCompany.modal.closeAria' | translate"
      (click)="cancel()"
    ></button>
  </div>

  <div class="modal-body">
    <jhi-alert-error></jhi-alert-error>

    <p id="jhi-delete-contactCompany-heading" class="mb-0">
      {{ 'correspCareApp.configManageContactCompany.modal.confirm.companyFull' | translate: { name: contactCompany.nom } }}
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      <fa-icon icon="ban"></fa-icon>&nbsp;
      <span>{{ 'correspCareApp.configManageContactCompany.modal.buttons.cancel' | translate }}</span>
    </button>

    <button id="jhi-confirm-delete-contactCompany" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <fa-icon icon="times"></fa-icon>&nbsp;
      <span>{{ 'correspCareApp.configManageContactCompany.modal.buttons.confirm' | translate }}</span>
    </button>
  </div>
</form>
