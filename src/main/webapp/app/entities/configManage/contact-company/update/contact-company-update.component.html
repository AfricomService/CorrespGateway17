<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-contact-company-heading"
        data-cy="ContactCompanyCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageContactCompany.home.createOrEditLabel"
      >
        Créer ou éditer un Contact Company
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.id" for="field_id">Id</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.nom" for="field_nom">Nom</label>
          <input type="text" class="form-control" name="nom" id="field_nom" data-cy="nom" formControlName="nom" />
          <div *ngIf="editForm.get('nom')!.invalid && (editForm.get('nom')!.dirty || editForm.get('nom')!.touched)">
            <small class="form-text text-danger" *ngIf="editForm.get('nom')?.errors?.required" jhiTranslate="entity.validation.required">
              Ce champ est obligatoire.
            </small>
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.nomabrege" for="field_nomabrege"
            >Nomabrege</label
          >
          <input type="text" class="form-control" name="nomabrege" id="field_nomabrege" data-cy="nomabrege" formControlName="nomabrege" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.matrne" for="field_matrne">Matrne</label>
          <input type="text" class="form-control" name="matrne" id="field_matrne" data-cy="matrne" formControlName="matrne" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.pays" for="field_pays">Pays</label>
          <input type="text" class="form-control" name="pays" id="field_pays" data-cy="pays" formControlName="pays" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.adresse" for="field_adresse">Adresse</label>
          <input type="text" class="form-control" name="adresse" id="field_adresse" data-cy="adresse" formControlName="adresse" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.tel" for="field_tel">Tel</label>
          <input type="text" class="form-control" name="tel" id="field_tel" data-cy="tel" formControlName="tel" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.fax" for="field_fax">Fax</label>
          <input type="text" class="form-control" name="fax" id="field_fax" data-cy="fax" formControlName="fax" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.email" for="field_email">Email</label>
          <input type="text" class="form-control" name="email" id="field_email" data-cy="email" formControlName="email" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.webpage" for="field_webpage">Webpage</label>
          <input type="text" class="form-control" name="webpage" id="field_webpage" data-cy="webpage" formControlName="webpage" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageContactCompany.etat" for="field_etat">Etat</label>
          <select class="form-control" name="etat" formControlName="etat" id="field_etat" data-cy="etat">
            <option [ngValue]="null">{{ 'correspCareApp.UsualStatus.null' | translate }}</option>
            <option *ngFor="let usualStatus of usualStatusValues" [value]="usualStatus">
              {{ 'correspCareApp.UsualStatus.' + usualStatus | translate }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
