<div>
  <h2 id="page-heading" data-cy="ParentClassdefHeading">
    <span jhiTranslate="correspCareApp.configManageParentClassdef.home.title">ParentClassdefs</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="correspCareApp.configManageParentClassdef.home.refreshListLabel">Actualiser la liste</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-parent-classdef"
        [routerLink]="['/parent-classdef/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="correspCareApp.configManageParentClassdef.home.createLabel"> Créer un nouveau Parent Classdef </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <div class="alert alert-warning" id="no-result" *ngIf="parentClassdefs?.length === 0">
    <span jhiTranslate="correspCareApp.configManageParentClassdef.home.notFound">Aucun Parent Classdef trouvé</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="parentClassdefs && parentClassdefs.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.configManageParentClassdef.id">Id</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="type">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.configManageParentClassdef.type">Type</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="sequenceId.id">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.configManageParentClassdef.sequenceId">Sequence Id</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let parentClassdef of parentClassdefs; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/parent-classdef', parentClassdef.id, 'view']">{{ parentClassdef.id }}</a>
          </td>
          <td jhiTranslate="{{ 'correspCareApp.CorrespType.' + parentClassdef.type }}">{{ parentClassdef.type }}</td>
          <td>
            <div *ngIf="parentClassdef.sequenceId">
              <a [routerLink]="['/numsequentielle', parentClassdef.sequenceId.id, 'view']">{{ parentClassdef.sequenceId.id }}</a>
            </div>
          </td>
          <td class="text-end">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/parent-classdef', parentClassdef.id, 'view']"
                class="btn btn-info btn-sm"
                data-cy="entityDetailsButton"
              >
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">Voir</span>
              </button>

              <button
                type="submit"
                [routerLink]="['/parent-classdef', parentClassdef.id, 'edit']"
                class="btn btn-primary btn-sm"
                data-cy="entityEditButton"
              >
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Editer</span>
              </button>

              <button type="submit" (click)="delete(parentClassdef)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Supprimer</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="parentClassdefs && parentClassdefs.length > 0">
    <div class="d-flex justify-content-center">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
    </div>

    <div class="d-flex justify-content-center">
      <ngb-pagination
        [collectionSize]="totalItems"
        [page]="page"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="navigateToPage($event)"
      ></ngb-pagination>
    </div>
  </div>
</div>
