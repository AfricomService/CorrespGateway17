<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-parent-classdef-heading"
        data-cy="ParentClassdefCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageParentClassdef.home.createOrEditLabel"
      >
        Créer ou éditer un Parent Classdef
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.configManageParentClassdef.id" for="field_id">Id</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageParentClassdef.type" for="field_type">Type</label>
          <select class="form-control" name="type" formControlName="type" id="field_type" data-cy="type">
            <option [ngValue]="null">{{ 'correspCareApp.CorrespType.null' | translate }}</option>
            <option *ngFor="let correspType of correspTypeValues" [value]="correspType">
              {{ 'correspCareApp.CorrespType.' + correspType | translate }}
            </option>
          </select>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageParentClassdef.sequenceId" for="field_sequenceId"
            >Sequence Id</label
          >
          <select
            class="form-control"
            id="field_sequenceId"
            data-cy="sequenceId"
            name="sequenceId"
            formControlName="sequenceId"
            [compareWith]="compareNumsequentielle"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="numsequentielleOption" *ngFor="let numsequentielleOption of numsequentiellesSharedCollection">
              {{ numsequentielleOption.id }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
