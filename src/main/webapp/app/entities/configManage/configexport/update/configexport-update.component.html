<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-configexport-heading"
        data-cy="ConfigexportCreateUpdateHeading"
        jhiTranslate="correspCareApp.configManageConfigexport.home.createOrEditLabel"
      >
        Créer ou éditer un Configexport
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.id" for="field_id">Id</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.label" for="field_label">Label</label>
          <input type="text" class="form-control" name="label" id="field_label" data-cy="label" formControlName="label" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.active" for="field_active">Active</label>
          <input type="checkbox" class="form-check" name="active" id="field_active" data-cy="active" formControlName="active" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.excelFile" for="field_excelFile"
            >Excel File</label
          >
          <div>
            <div *ngIf="editForm.get('excelFile')!.value" class="form-text text-danger clearfix">
              <a
                class="pull-start"
                (click)="openFile(editForm.get('excelFile')!.value!, editForm.get('excelFileContentType')!.value!)"
                jhiTranslate="entity.action.open"
                >Ouvrir</a
              ><br />
              <span class="pull-start"
                >{{ editForm.get('excelFileContentType')!.value }}, {{ byteSize(editForm.get('excelFile')!.value!) }}</span
              >
              <button
                type="button"
                (click)="editForm.patchValue({ excelFile: undefined, excelFileContentType: undefined })"
                class="btn btn-secondary btn-xs pull-end"
              >
                <fa-icon icon="times"></fa-icon>
              </button>
            </div>
            <input
              type="file"
              id="file_excelFile"
              data-cy="excelFile"
              (change)="setFileData($event, 'excelFile', false)"
              jhiTranslate="entity.action.addblob"
            />
          </div>
          <input type="hidden" class="form-control" name="excelFile" id="field_excelFile" data-cy="excelFile" formControlName="excelFile" />
          <input
            type="hidden"
            class="form-control"
            name="excelFileContentType"
            id="field_excelFileContentType"
            formControlName="excelFileContentType"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.dateCreated" for="field_dateCreated"
            >Date Created</label
          >
          <div class="d-flex">
            <input
              id="field_dateCreated"
              data-cy="dateCreated"
              type="datetime-local"
              class="form-control"
              name="dateCreated"
              formControlName="dateCreated"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.configMappingJson" for="field_configMappingJson"
            >Config Mapping Json</label
          >
          <input
            type="text"
            class="form-control"
            name="configMappingJson"
            id="field_configMappingJson"
            data-cy="configMappingJson"
            formControlName="configMappingJson"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.configManageConfigexport.readAccess" for="field_readAccess"
            >Read Access</label
          >
          <input
            type="text"
            class="form-control"
            name="readAccess"
            id="field_readAccess"
            data-cy="readAccess"
            formControlName="readAccess"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
