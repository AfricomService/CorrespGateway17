<div>
  <h3 class="title">Consultation des Correspondances</h3>

  <!-- Barre de recherche rapide -->
  <div class="quick-search-bar">
    <div class="input-group">
      <span class="input-group-text">
        <i class="fas fa-search"></i>
      </span>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="quickSearch"
        placeholder="Rechercher par référence, sujet ou expéditeur..."
        (keyup.enter)="onQuickSearch()"
        (input)="quickSearch.trim() === '' && clearQuickSearch()"
      />
      <button class="btn btn-primary" (click)="onQuickSearch()" [disabled]="!quickSearch.trim()">Rechercher</button>
      <button *ngIf="isSearching" class="btn btn-outline-secondary" (click)="clearQuickSearch()">✕ Effacer</button>
    </div>
  </div>

  <div class="filter-panel-container">
    <!-- Dans la quick-search-bar, ajoutez avant le bouton Rechercher : -->
    <button class="btn btn-outline-filter" [class.active]="isOpen" (click)="togglePanel()">
      <i class="fas fa-filter"></i>
      Filtres avancés
    </button>

    <div class="filter-content" [class.open]="isOpen">
      <div class="filter-panel">
        <select class="form-select" [(ngModel)]="selectedFilter" (change)="resetFilterValue()">
          <option value="" disabled selected>-- Choisir un filtre --</option>
          <option *ngFor="let opt of availableFilters" [value]="opt.value">
            {{ opt.label }}
          </option>
        </select>

        <ng-container [ngSwitch]="selectedFilter">
          <input
            class="form-control"
            *ngSwitchCase="'reference'"
            type="text"
            [(ngModel)]="filterValue"
            placeholder="Entrer une référence"
          />

          <select class="form-select" *ngSwitchCase="'status'" [(ngModel)]="filterValue">
            <option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</option>
          </select>

          <select class="form-select" *ngSwitchCase="'dispatchType'" [(ngModel)]="filterValue">
            <option *ngFor="let d of dispatchOptions" [value]="d.value">{{ d.label }}</option>
          </select>

          <div style="display: flex; gap: 1em; align-items: center" *ngSwitchCase="'courrierDate'">
            <input class="form-control" type="date" [(ngModel)]="dateRange.startDate" />
            <span style="font-weight: bold">➔</span>
            <input class="form-control" type="date" [(ngModel)]="dateRange.endDate" />
          </div>
        </ng-container>

        <button
          [disabled]="
            !selectedFilter ||
            (selectedFilter !== 'courrierDate' && !filterValue) ||
            (selectedFilter === 'courrierDate' && (!dateRange.startDate || !dateRange.endDate))
          "
          class="btn btn-primary"
          (click)="addFilter()"
        >
          Ajouter
        </button>

        <button class="btn btn-danger" (click)="applyFilters()" [disabled]="activeFilters.length === 0">Appliquer</button>
      </div>

      <div class="active-filters-custom-filter" *ngIf="!(activeFilters.length > 0)">
        <div style="display: flex; flex-direction: row; gap: 1em; flex-wrap: wrap">
          <div class="filter-chip-wrapper-custom-filter" *ngFor="let filter of loadedFiltres">
            <span class="filter-chip-custom-filter" [class.active-custom-filter]="filter.active" (click)="selectOnlyThisFilter(filter)">
              {{ filter.name }}
            </span>
            <div class="tooltip-custom-filter">
              <div *ngFor="let entry of getFilterEntries(filter.filters)">{{ entry.key }}: {{ entry.value }}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="active-filters" *ngIf="activeFilters.length > 0">
        <div style="display: flex; flex-direction: row; gap: 1em; flex-wrap: wrap">
          <span style="display: flex; gap: 0.5em" *ngFor="let filter of activeFilters; let i = index" class="filter-chip">
            {{ filter.label }} : {{ filter.displayValue }}
            <span class="remove-btn" (click)="removeFilter(i)">X</span>
          </span>
        </div>
        <!--    <div>-->
        <!--          <span *ngIf="filterApplied"  style="text-align: center;cursor: pointer" (click)="saveCustomFilters()" class="filter-chip">-->
        <!--      Sauvegarder ce filtre-->
        <!--    </span>-->
        <!--    </div>-->

        <div>
          <span
            *ngIf="filterApplied"
            style="text-align: center; cursor: pointer"
            class="filter-chip"
            (click)="openCustomSearchModal(saveFilterModal)"
            [class.disabled-btn]="isSaving"
          >
            {{ isSaving ? 'Filtre ajouté avec succès' : 'Sauvegarder ce filtre' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #saveFilterModal let-saveFilterModal class="modal-dialog">
    <div class="modal-header">
      <h4 class="modal-title">Ajout de filtre pérsonalisé</h4>
    </div>
    <div class="modal-body">
      <div style="padding-bottom: 1.5em">
        <input class="form-control" type="text" [(ngModel)]="nameFilter" placeholder="Entrer le nom de votre filtre pérsonalisé" />
      </div>
      <div class="active-filters" *ngIf="activeFilters.length > 0">
        <div style="display: flex; flex-direction: row; gap: 1em; flex-wrap: wrap">
          <span style="display: flex; gap: 0.5em" *ngFor="let filter of activeFilters; let i = index" class="filter-chip">
            {{ filter.label }} : {{ filter.displayValue }}
          </span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-light btn-model" (click)="saveFilterModal.close('Close click')">
        <span>Annuler</span>
      </button>
      <button type="submit" class="btn btn-primary btn-model" (click)="saveCustomFilters()"><span>Enregistrer</span></button>
    </div>
  </ng-template>

  <dx-data-grid
    [dataSource]="datasource"
    [showBorders]="true"
    [height]="'100%'"
    [columnAutoWidth]="true"
    [remoteOperations]="{ paging: true }"
    (onRowDblClick)="onRowDoubleClick($event)"
    (onRowPrepared)="onRowPrepared($event)"
  >
    <dxo-paging [enabled]="true" [pageSize]="15"></dxo-paging>

    <dxi-column dataField="reference" caption="Référence"></dxi-column>
    <dxi-column dataField="corresptype" caption="Type"></dxi-column>
    <dxi-column dataField="courrierDate" caption="Date courrier" dataType="date"></dxi-column>
    <dxi-column dataField="msgSender" caption="Expéditeur"></dxi-column>
    <dxi-column dataField="msgReceiver" caption="Destinataire(s)"></dxi-column>
    <dxi-column dataField="status" caption="Statut"></dxi-column>

    <dxi-column caption="Priorité" alignment="center" [fixed]="true" fixedPosition="right" cellTemplate="PrioriteTemplate">
      <div *dxTemplate="let d of 'PrioriteTemplate'">
        <span *ngIf="d.data.priority" style="color: red; font-weight: bold">🚨</span>
      </div>
    </dxi-column>
  </dx-data-grid>
</div>
