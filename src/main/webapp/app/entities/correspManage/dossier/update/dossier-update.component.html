<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-dossier-heading"
        data-cy="DossierCreateUpdateHeading"
        jhiTranslate="correspCareApp.correspManageDossier.home.createOrEditLabel"
      >
        Créer ou éditer un Dossier
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.name" for="field_name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.isPublic" for="field_isPublic">Is Public</label>
          <input type="checkbox" class="form-check" name="isPublic" id="field_isPublic" data-cy="isPublic" formControlName="isPublic" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.responsible" for="field_responsible"
            >Responsible</label
          >
          <input
            type="text"
            class="form-control"
            name="responsible"
            id="field_responsible"
            data-cy="responsible"
            formControlName="responsible"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.status" for="field_status">Status</label>
          <select class="form-control" name="status" formControlName="status" id="field_status" data-cy="status">
            <option [ngValue]="null">{{ 'correspCareApp.UsualStatus.null' | translate }}</option>
            <option *ngFor="let usualStatus of usualStatusValues" [value]="usualStatus">
              {{ 'correspCareApp.UsualStatus.' + usualStatus | translate }}
            </option>
          </select>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.dossierList" for="field_dossierList"
            >Dossier List</label
          >
          <div>
            <div *ngIf="editForm.get('dossierList')!.value" class="form-text text-danger clearfix">
              <a
                class="pull-start"
                (click)="openFile(editForm.get('dossierList')!.value!, editForm.get('dossierListContentType')!.value!)"
                jhiTranslate="entity.action.open"
                >Ouvrir</a
              ><br />
              <span class="pull-start"
                >{{ editForm.get('dossierListContentType')!.value }}, {{ byteSize(editForm.get('dossierList')!.value!) }}</span
              >
              <button
                type="button"
                (click)="editForm.patchValue({ dossierList: undefined, dossierListContentType: undefined })"
                class="btn btn-secondary btn-xs pull-end"
              >
                <fa-icon icon="times"></fa-icon>
              </button>
            </div>
            <input
              type="file"
              id="file_dossierList"
              data-cy="dossierList"
              (change)="setFileData($event, 'dossierList', false)"
              jhiTranslate="entity.action.addblob"
            />
          </div>
          <input
            type="hidden"
            class="form-control"
            name="dossierList"
            id="field_dossierList"
            data-cy="dossierList"
            formControlName="dossierList"
          />
          <input
            type="hidden"
            class="form-control"
            name="dossierListContentType"
            id="field_dossierListContentType"
            formControlName="dossierListContentType"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.createdBy" for="field_createdBy">Created By</label>
          <input type="text" class="form-control" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.updatedBy" for="field_updatedBy">Updated By</label>
          <input type="text" class="form-control" name="updatedBy" id="field_updatedBy" data-cy="updatedBy" formControlName="updatedBy" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="correspCareApp.correspManageDossier.updatedDate" for="field_updatedDate"
            >Updated Date</label
          >
          <div class="d-flex">
            <input
              id="field_updatedDate"
              data-cy="updatedDate"
              type="datetime-local"
              class="form-control"
              name="updatedDate"
              formControlName="updatedDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
