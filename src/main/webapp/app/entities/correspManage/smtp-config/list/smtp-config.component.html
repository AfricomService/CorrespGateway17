<div>
  <h2 id="page-heading" data-cy="SmtpConfigHeading">
    <span jhiTranslate="correspCareApp.correspManageSmtpConfig.home.title">SmtpConfigs</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="correspCareApp.correspManageSmtpConfig.home.refreshListLabel">Actualiser la liste</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-smtp-config"
        [routerLink]="['/smtp-config/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="correspCareApp.correspManageSmtpConfig.home.createLabel"> Créer un nouveau Smtp Config </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <div class="alert alert-warning" id="no-result" *ngIf="smtpConfigs?.length === 0">
    <span jhiTranslate="correspCareApp.correspManageSmtpConfig.home.notFound">Aucun Smtp Config trouvé</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="smtpConfigs && smtpConfigs.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="name">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.correspManageSmtpConfig.name">Name</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col" jhiSortBy="smtpHost">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.correspManageSmtpConfig.smtpHost">Smtp Host</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col" jhiSortBy="active">
            <div class="d-flex">
              <span jhiTranslate="correspCareApp.correspManageSmtpConfig.active">Active</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col"></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let smtpConfig of smtpConfigs; trackBy: trackId" data-cy="entityTable">
          <td>{{ smtpConfig.name }}</td>
          <td>{{ smtpConfig.smtpHost }}</td>
          <td>{{ smtpConfig.active }}</td>

          <td class="text-end">
            <div class="btn-group">
              <button
                type="submit"
                [routerLink]="['/smtp-config', smtpConfig.id, 'view']"
                class="btn btn-info btn-sm"
                data-cy="entityDetailsButton"
              >
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">Voir</span>
              </button>

              <button
                type="submit"
                [routerLink]="['/smtp-config', smtpConfig.id, 'edit']"
                class="btn btn-primary btn-sm"
                data-cy="entityEditButton"
              >
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Editer</span>
              </button>

              <button type="submit" (click)="delete(smtpConfig)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Supprimer</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
